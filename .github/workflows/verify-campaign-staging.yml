name: Verify PHAM Campaign Staging

on:
  workflow_dispatch:
    inputs:
      expected_state:
        description: Expected Edition Engine state during verification
        required: true
        default: reservation_open
        type: choice
        options:
          - prelaunch
          - reservation_open
          - reservation_full
          - final_payment
          - sold_out
          - archived

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CAMPAIGN_BACKEND_URL: ${{ secrets.CAMPAIGN_BACKEND_URL }}
      INTERNAL_ADMIN_KEY: ${{ secrets.INTERNAL_ADMIN_KEY }}
      STOREFRONT_ORIGIN: ${{ secrets.STOREFRONT_ORIGIN }}
      STOREFRONT_PASSWORD: ${{ secrets.STOREFRONT_PASSWORD }}
      EXPECTED_STATE: ${{ inputs.expected_state }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate verification secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${CAMPAIGN_BACKEND_URL:?Missing CAMPAIGN_BACKEND_URL}"
          : "${INTERNAL_ADMIN_KEY:?Missing INTERNAL_ADMIN_KEY}"
          : "${EXPECTED_STATE:?Missing expected_state}"
          if [ -z "${STOREFRONT_ORIGIN:-}" ]; then
            echo "STOREFRONT_ORIGIN=https://phamofficial.com" >> "$GITHUB_ENV"
          fi

      - name: Authenticate password-protected storefront
        shell: bash
        run: |
          set -euo pipefail
          cookie_jar="$RUNNER_TEMP/pham-storefront.cookies"
          : > "$cookie_jar"

          if [ -n "${STOREFRONT_PASSWORD:-}" ]; then
            code="$(curl --silent --show-error --location               --user-agent 'PHAM-Staging-E2E/1.0'               --cookie-jar "$cookie_jar"               --data-urlencode 'form_type=storefront_password'               --data-urlencode 'utf8=✓'               --data-urlencode "password=${STOREFRONT_PASSWORD}"               --output /dev/null               --write-out '%{http_code}'               "${STOREFRONT_ORIGIN%/}/password")"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::error::Storefront password authentication returned HTTP $code"
              exit 1
            fi
          fi

          echo "PHAM_STOREFRONT_COOKIE_JAR=$cookie_jar" >> "$GITHUB_ENV"

      - name: Worker health
        working-directory: backend
        run: node admin.mjs health

      - name: Backend readiness
        working-directory: backend
        run: node admin.mjs readiness --edition=edition-01

      - name: Shopify App Proxy campaign route
        shell: bash
        run: |
          set -euo pipefail
          url="${STOREFRONT_ORIGIN%/}/apps/pham-edition/campaign?edition=edition-01"
          body="$(mktemp)"
          code="$(curl --silent --show-error --location             --user-agent 'PHAM-Staging-E2E/1.0'             --header 'Accept: application/json'             --cookie "$PHAM_STOREFRONT_COOKIE_JAR"             --output "$body"             --write-out '%{http_code}'             "$url")"
          cat "$body"
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::App Proxy campaign route returned HTTP $code"
            exit 1
          fi
          node -e '
            const fs=require("fs");
            const raw=fs.readFileSync(process.argv[1],"utf8");
            const expected=process.env.EXPECTED_STATE;
            const body=JSON.parse(raw);
            if(!body.edition || !body.counters){
              console.error("App Proxy response is missing edition/counters");
              process.exit(1);
            }
            const expectedSizes=["M","L","XL","XXL"];
            if(!Array.isArray(body.edition.sizeOptions) || JSON.stringify(body.edition.sizeOptions) !== JSON.stringify(expectedSizes)){
              console.error("App Proxy canonical sizeOptions mismatch:", body.edition.sizeOptions);
              process.exit(1);
            }
            if(body.edition.state !== expected){
              console.error("Campaign state mismatch. Expected", expected, "got", body.edition.state);
              process.exit(1);
            }
            if(!body.edition.designOrigin){
              console.error("Public campaign response is missing designOrigin");
              process.exit(1);
            }
            if(Object.prototype.hasOwnProperty.call(body.edition, "productionOrigin")){
              console.error("Public campaign response must not expose productionOrigin");
              process.exit(1);
            }
            console.log("App Proxy state:", body.edition.state);
            console.log("Sizes:", body.edition.sizeOptions.join(", "));
            console.log("Reserved:", body.counters.reserved + "/" + body.edition.editionSize);
            console.log("Design origin:", body.edition.designOrigin);
          ' "$body"

      - name: Anonymous collector route stays private
        shell: bash
        run: |
          set -euo pipefail
          url="${STOREFRONT_ORIGIN%/}/apps/pham-edition/status?edition=edition-01"
          body="$(mktemp)"
          code="$(curl --silent --show-error --location             --user-agent 'PHAM-Staging-E2E/1.0'             --header 'Accept: application/json'             --cookie "$PHAM_STOREFRONT_COOKIE_JAR"             --output "$body"             --write-out '%{http_code}'             "$url")"
          cat "$body"
          echo
          if [ "$code" -ne 401 ]; then
            echo "::error::Anonymous collector status must return HTTP 401, got $code"
            exit 1
          fi
          node -e '
            const fs=require("fs");
            const body=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(body.error !== "customer_login_required"){
              console.error("Unexpected collector auth error:", body);
              process.exit(1);
            }
          ' "$body"

      - name: Invalid Birth Record token fails closed
        shell: bash
        run: |
          set -euo pipefail
          url="${STOREFRONT_ORIGIN%/}/apps/pham-edition/provenance?token=invalid"
          body="$(mktemp)"
          code="$(curl --silent --show-error --location             --user-agent 'PHAM-Staging-E2E/1.0'             --header 'Accept: application/json'             --cookie "$PHAM_STOREFRONT_COOKIE_JAR"             --output "$body"             --write-out '%{http_code}'             "$url")"
          cat "$body"
          echo
          if [ "$code" -ne 422 ]; then
            echo "::error::Invalid Birth Record token must return HTTP 422, got $code"
            exit 1
          fi
          node -e '
            const fs=require("fs");
            const body=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(body.error !== "invalid_provenance_token"){
              console.error("Unexpected provenance error:", body);
              process.exit(1);
            }
          ' "$body"

      - name: Standby POST cannot mutate prelaunch
        if: ${{ inputs.expected_state == 'prelaunch' }}
        shell: bash
        run: |
          set -euo pipefail
          url="${STOREFRONT_ORIGIN%/}/apps/pham-edition/standby/join"
          body="$(mktemp)"
          code="$(curl --silent --show-error --location             --user-agent 'PHAM-Staging-E2E/1.0'             --header 'Accept: application/json'             --header 'Content-Type: application/json'             --cookie "$PHAM_STOREFRONT_COOKIE_JAR"             --request POST             --data '{"editionId":"edition-01","email":"staging-e2e@example.invalid","name":"PHAM staging","country":"VN","size":"M"}'             --output "$body"             --write-out '%{http_code}'             "$url")"
          cat "$body"
          echo
          if [ "$code" -ne 409 ]; then
            echo "::error::Standby must remain closed in prelaunch; expected HTTP 409, got $code"
            exit 1
          fi
          node -e '
            const fs=require("fs");
            const body=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(body.error !== "standby_not_open"){
              console.error("Unexpected standby prelaunch result:", body);
              process.exit(1);
            }
          ' "$body"

      - name: Verify expected campaign state
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          state="$(node admin.mjs state --edition=edition-01)"
          echo "$state"
          node -e '
            const body=JSON.parse(process.argv[1]);
            const expected=process.env.EXPECTED_STATE;
            const actual=body.state || body.edition?.state;
            if(actual !== expected){
              console.error("Campaign state mismatch. Expected", expected, "got", actual);
              process.exit(1);
            }
          ' "$state"
