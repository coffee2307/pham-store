name: Theme Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: theme-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@latest

      - name: Check PHAM JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/pham-*.js; do
            node --check "$file"
          done

      - name: Check PHAM backend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/worker.js
          node --check backend/admin.mjs
          node --check backend/register-shopify-webhooks.mjs

      - name: Run PHAM backend tests
        run: node --test backend/worker.test.mjs

      - name: Check PHAM D1 migration drift
        run: python backend/check-schema.py

      - name: Check PHAM campaign launch gates
        run: node scripts/check-campaign-safety.mjs

      - name: Check PHAM Edition Engine syntax
        run: npm --prefix apps/edition-engine run check

      - name: Test PHAM Edition Engine
        run: npm --prefix apps/edition-engine test

      - name: Run Shopify Theme Check
        run: shopify theme check
