name: Audit PHAM Campaign Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend tooling
        run: npm install

      - name: Validate Cloudflare audit secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_D1_DATABASE_ID:?Missing CLOUDFLARE_D1_DATABASE_ID}"

      - name: Inject D1 database ID
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${CLOUDFLARE_D1_DATABASE_ID}/g" wrangler.toml

      - name: List remote migrations
        run: npx wrangler d1 migrations list PHAM_CAMPAIGN_DB --remote

      - name: Remote schema inventory
        run: >
          npx wrangler d1 execute PHAM_CAMPAIGN_DB --remote
          --command "SELECT name, type FROM sqlite_master WHERE type IN ('table','index') ORDER BY type,name;"

      - name: Editions schema
        run: >
          npx wrangler d1 execute PHAM_CAMPAIGN_DB --remote
          --command "PRAGMA table_info('editions');"

      - name: Reservations schema
        run: >
          npx wrangler d1 execute PHAM_CAMPAIGN_DB --remote
          --command "PRAGMA table_info('reservations');"

      - name: Standby schema
        run: >
          npx wrangler d1 execute PHAM_CAMPAIGN_DB --remote
          --command "PRAGMA table_info('standby');"

      - name: Objects schema
        run: >
          npx wrangler d1 execute PHAM_CAMPAIGN_DB --remote
          --command "PRAGMA table_info('objects');"

      - name: Webhook schema
        run: >
          npx wrangler d1 execute PHAM_CAMPAIGN_DB --remote
          --command "PRAGMA table_info('webhook_events');"

      - name: Lifecycle schema
        run: >
          npx wrangler d1 execute PHAM_CAMPAIGN_DB --remote
          --command "PRAGMA table_info('object_lifecycle_events');"
