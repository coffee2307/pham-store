name: Deploy PHAM Campaign Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
      CAMPAIGN_BACKEND_URL: ${{ secrets.CAMPAIGN_BACKEND_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend tooling
        run: npm install

      - name: Validate Worker syntax
        run: node --check worker.js

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply PHAM_CAMPAIGN_DB --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Register Shopify webhooks
        if: ${{ env.SHOPIFY_SHOP_DOMAIN != '' && env.SHOPIFY_ADMIN_TOKEN != '' && env.CAMPAIGN_BACKEND_URL != '' }}
        run: node register-shopify-webhooks.mjs
