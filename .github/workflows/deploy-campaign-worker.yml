name: Deploy PHAM Campaign Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      CAMPAIGN_BACKEND_URL: ${{ secrets.CAMPAIGN_BACKEND_URL }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      INTERNAL_ADMIN_KEY: ${{ secrets.INTERNAL_ADMIN_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend tooling
        run: npm install

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_D1_DATABASE_ID
            SHOPIFY_SHOP_DOMAIN
            SHOPIFY_CLIENT_ID
            SHOPIFY_CLIENT_SECRET
            INTERNAL_ADMIN_KEY
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required GitHub secret: $key"
              exit 1
            fi
          done

      - name: Inject D1 database ID
        shell: bash
        run: |
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${CLOUDFLARE_D1_DATABASE_ID}/g" wrangler.toml
          if grep -q "REPLACE_WITH_D1_DATABASE_ID" wrangler.toml; then
            echo "::error::D1 database ID placeholder was not replaced"
            exit 1
          fi

      - name: Validate Worker syntax
        run: node --check worker.js

      - name: Run backend tests
        run: npm test

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply PHAM_CAMPAIGN_DB --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Upload Worker secrets
        shell: bash
        run: |
          printf '%s' "${SHOPIFY_CLIENT_ID}" | npx wrangler secret put SHOPIFY_CLIENT_ID
          printf '%s' "${SHOPIFY_CLIENT_SECRET}" | npx wrangler secret put SHOPIFY_CLIENT_SECRET
          printf '%s' "${INTERNAL_ADMIN_KEY}" | npx wrangler secret put INTERNAL_ADMIN_KEY

      - name: Deploy final Worker version
        run: npx wrangler deploy

      - name: Register Shopify webhooks
        if: ${{ env.SHOPIFY_CLIENT_ID != '' && env.SHOPIFY_CLIENT_SECRET != '' && env.CAMPAIGN_BACKEND_URL != '' }}
        run: node register-shopify-webhooks.mjs

      - name: First-deploy webhook reminder
        if: ${{ env.CAMPAIGN_BACKEND_URL == '' }}
        shell: bash
        run: |
          echo "::notice::Worker deployed, but CAMPAIGN_BACKEND_URL is not configured yet."
          echo "::notice::Copy the deployed Worker URL into the CAMPAIGN_BACKEND_URL GitHub secret, then rerun this workflow to register ORDERS_PAID plus FULFILLMENTS_CREATE/UPDATE."
