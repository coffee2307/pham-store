# Create PHAM storefront pages.
# Prefer Admin UI: Online Store → Pages (see scripts/pham-launch-setup.graphql for the full list).
# Or run this mutation in Admin GraphiQL (Develop apps → GraphiQL).
# CLI 4.x+: shopify store execute --store DOMAIN --query-file scripts/create-pham-pages.graphql --allow-mutations

mutation CreatePhamPages {
  page1: pageCreate(
    page: {
      title: "Pre-order"
      handle: "pre-order"
      templateSuffix: "pre-order"
      body: ""
      isPublished: true
    }
  ) {
    page { id handle }
    userErrors { field message }
  }

  page2: pageCreate(
    page: {
      title: "Waitlist thank you"
      handle: "waitlist-thank-you"
      templateSuffix: "waitlist-thank-you"
      body: ""
      isPublished: true
    }
  ) {
    page { id handle }
    userErrors { field message }
  }

  page3: pageCreate(
    page: {
      title: "FAQ"
      handle: "faq"
      templateSuffix: "faq"
      body: ""
      isPublished: true
    }
  ) {
    page { id handle }
    userErrors { field message }
  }

  page4: pageCreate(
    page: {
      title: "Size guide"
      handle: "size-guide"
      templateSuffix: "size-guide"
      body: ""
      isPublished: true
    }
  ) {
    page { id handle }
    userErrors { field message }
  }
}
