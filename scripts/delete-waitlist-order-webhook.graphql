# Remove ORDERS_PAID webhook (no longer used — manual order handling).
# Run via Shopify CLI after replacing Apps Script with pham-contact-backend.gs:
#
#   shopify store auth
#   shopify store execute --query @scripts/delete-waitlist-order-webhook.graphql
#
# If the callback URL differs, list webhooks first:
#   query { webhookSubscriptions(first: 20) { nodes { id topic endpoint { __typename ... on WebhookHttpEndpoint { callbackUrl } } } } }

mutation DeleteWaitlistOrderWebhook {
  webhookSubscriptionDelete(
    id: "gid://shopify/WebhookSubscription/REPLACE_WITH_YOUR_WEBHOOK_ID"
  ) {
    deletedWebhookSubscriptionId
    userErrors {
      field
      message
    }
  }
}
